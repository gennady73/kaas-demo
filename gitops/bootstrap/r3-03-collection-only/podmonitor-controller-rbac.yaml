apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kaas-r3-broker-monitor-writer
  namespace: kaas-kafka
rules:
- apiGroups:
  - monitoring.coreos.com
  resources:
  - podmonitors
  verbs:
  - create
- apiGroups:
  - monitoring.coreos.com
  resources:
  - podmonitors
  resourceNames:
  - kaas-dev-broker-metrics
  verbs:
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kaas-r3-broker-monitor-writer
  namespace: kaas-kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kaas-r3-broker-monitor-writer
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
