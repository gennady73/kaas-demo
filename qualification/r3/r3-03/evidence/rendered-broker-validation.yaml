apiVersion: v1
data:
  metrics.yml: |
    lowercaseOutputName: true
    rules:
    - pattern: kafka.server<type=ReplicaManager, name=(UnderReplicatedPartitions|UnderMinIsrPartitionCount|OfflineReplicaCount)><>Value
      name: kafka_server_replicamanager_$1
      type: GAUGE
    - pattern: kafka.controller<type=KafkaController, name=(ActiveControllerCount|OfflinePartitionsCount)><>Value
      name: kafka_controller_kafkacontroller_$1
      type: GAUGE
kind: ConfigMap
metadata:
  name: kaas-dev-r3-jmx-metrics
  namespace: kaas-kafka
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: kaas-dev
  namespace: kaas-kafka
spec:
  entityOperator:
    topicOperator:
      jvmOptions:
        -Xms: 128m
        -Xmx: 256m
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi
    userOperator:
      jvmOptions:
        -Xms: 128m
        -Xmx: 256m
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi
  kafka:
    authorization:
      type: simple
    config:
      auto.create.topics.enable: false
      default.replication.factor: 2
      log.retention.ms: 21600000
      message.max.bytes: 3145728
      min.insync.replicas: 2
      offsets.topic.replication.factor: 2
      replica.fetch.max.bytes: 4194304
      transaction.state.log.min.isr: 2
      transaction.state.log.replication.factor: 2
      unclean.leader.election.enable: false
    image: registry.redhat.io/amq-streams/kafka-42-rhel9@sha256:ce7dc91b664600c6f06e1df3d6b56a4684bb779865d9c28b4df648addd89189d
    listeners:
    - authentication:
        type: scram-sha-512
      name: tls
      networkPolicyPeers:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kaas-kafka
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kaas-demo
      port: 9093
      tls: true
      type: internal
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          key: metrics.yml
          name: kaas-dev-r3-jmx-metrics
    version: 4.2.0
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    kaas.example.com/monitoring: r3-03
  name: kaas-dev-broker-metrics
  namespace: kaas-kafka
spec:
  namespaceSelector:
    matchNames:
    - kaas-kafka
  podMetricsEndpoints:
  - interval: 30s
    path: /metrics
    port: tcp-prometheus
    relabelings:
    - replacement: kaas-dev
      targetLabel: kaas_cluster
    - replacement: broker
      targetLabel: kaas_component
    scrapeTimeout: 10s
  selector:
    matchLabels:
      strimzi.io/cluster: kaas-dev
      strimzi.io/component-type: kafka
      strimzi.io/name: kaas-dev-kafka
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    kaas.example.com/monitoring: r3-03
  name: kaas-dev-broker-health
  namespace: kaas-kafka
spec:
  groups:
  - name: kaas-dev-broker-health
    rules:
    - alert: KaaSBrokerMetricsUnavailable
      annotations:
        action: Inspect evidence and stop dependent work; no automatic restart, scale,
          ISR/retention change or deletion.
        summary: One or more of three sandbox broker scrape targets missing/down
      expr: sum(up{namespace="kaas-kafka",kaas_cluster="kaas-dev",kaas_component="broker"})
        < 3 or absent(up{namespace="kaas-kafka",kaas_cluster="kaas-dev",kaas_component="broker"})
      for: 3m
      labels:
        kaas_phase: r3-03
        kaas_service: kaas-dev
        severity: warning
    - alert: KaaSBrokerRequiredSeriesMissing
      annotations:
        action: Inspect evidence and stop dependent work; no automatic restart, scale,
          ISR/retention change or deletion.
        summary: Required Kafka metric family missing; cannot infer healthy zero
      expr: absent(kafka_server_replicamanager_underminisrpartitioncount{namespace="kaas-kafka",kaas_cluster="kaas-dev",kaas_component="broker"})
        or absent(kafka_controller_kafkacontroller_activecontrollercount{namespace="kaas-kafka",kaas_cluster="kaas-dev",kaas_component="broker"})
      for: 3m
      labels:
        kaas_phase: r3-03
        kaas_service: kaas-dev
        severity: warning
    - alert: KaaSBelowMinISR
      annotations:
        action: Inspect evidence and stop dependent work; no automatic restart, scale,
          ISR/retention change or deletion.
        summary: Partitions below configured minimum ISR
      expr: max(kafka_server_replicamanager_underminisrpartitioncount{namespace="kaas-kafka",kaas_cluster="kaas-dev",kaas_component="broker"})
        > 0
      for: 1m
      labels:
        kaas_phase: r3-03
        kaas_service: kaas-dev
        severity: critical
    - alert: KaaSUnderReplicatedPartitions
      annotations:
        action: Inspect evidence and stop dependent work; no automatic restart, scale,
          ISR/retention change or deletion.
        summary: Kafka replicas not fully in sync
      expr: max(kafka_server_replicamanager_underreplicatedpartitions{namespace="kaas-kafka",kaas_cluster="kaas-dev",kaas_component="broker"})
        > 0
      for: 5m
      labels:
        kaas_phase: r3-03
        kaas_service: kaas-dev
        severity: warning
    - alert: KaaSOfflinePartitions
      annotations:
        action: Inspect evidence and stop dependent work; no automatic restart, scale,
          ISR/retention change or deletion.
        summary: Controller reports offline partitions
      expr: max(kafka_controller_kafkacontroller_offlinepartitionscount{namespace="kaas-kafka",kaas_cluster="kaas-dev",kaas_component="broker"})
        > 0
      for: 1m
      labels:
        kaas_phase: r3-03
        kaas_service: kaas-dev
        severity: critical
    - alert: KaaSControllerCountUnexpected
      annotations:
        action: Inspect evidence and stop dependent work; no automatic restart, scale,
          ISR/retention change or deletion.
        summary: Expected exactly one active controller in the observed dual-role
          cluster
      expr: sum(kafka_controller_kafkacontroller_activecontrollercount{namespace="kaas-kafka",kaas_cluster="kaas-dev",kaas_component="broker"})
        != 1
      for: 3m
      labels:
        kaas_phase: r3-03
        kaas_service: kaas-dev
        severity: critical
