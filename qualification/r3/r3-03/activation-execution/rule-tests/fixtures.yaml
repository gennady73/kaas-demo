  - series: kafka_server_replicamanager_underminisrpartitioncount{namespace="kaas-kafka",kaas_cluster="kaas-dev",kaas_component="broker",pod="broker-0"}
    values: 1+0x12
  - *id003
  - *id004
  - *id005
  - *id006
  - series: kafka_server_replicamanager_underminisrpartitioncount{namespace="kaas-kafka",kaas_cluster="kaas-dev",kaas_component="broker",pod="broker-1"}
    values: 1+0x12
  - *id008
  - *id009
  - *id010
  - *id018
  - series: kafka_server_replicamanager_underminisrpartitioncount{namespace="kaas-kafka",kaas_cluster="kaas-dev",kaas_component="broker",pod="broker-2"}
    values: 1+0x12
  - *id012
  - *id013
  - *id014
  - *id015
  - *id016
  alert_rule_test:
  - eval_time: 10m
