apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaas-r2-harness
  namespace: kaas-demo
  labels:
    kaas.example.com/component: r2-preparation
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaas-r2-network-probe
  namespace: kaas-demo
  labels:
    kaas.example.com/component: r2-preparation
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kaas-r2-trusted
  namespace: kaas-demo
  annotations:
    kaas.example.com/status: PREPARATION_ONLY_NOT_APPLIED
    kaas.example.com/evidence-egress: Unresolved; add exact selected durable-sink
      peer before any live harness use
spec:
  podSelector:
    matchLabels:
      kaas.example.com/r2-runner: trusted
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-dns
      podSelector:
        matchLabels:
          dns.operator.openshift.io/daemonset-dns: default
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: dns
    - protocol: TCP
      port: dns-tcp
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kaas-kafka
      podSelector:
        matchLabels:
          strimzi.io/cluster: kaas-dev
          strimzi.io/name: kaas-dev-kafka
    ports:
    - protocol: TCP
      port: 9093
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kaas-r2-network-denied
  namespace: kaas-demo
  annotations:
    kaas.example.com/status: PREPARATION_ONLY_NOT_APPLIED
    kaas.example.com/evidence-egress: Unresolved; add exact selected durable-sink
      peer before any live harness use
spec:
  podSelector:
    matchLabels:
      kaas.example.com/r2-runner: network-denied
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-dns
      podSelector:
        matchLabels:
          dns.operator.openshift.io/daemonset-dns: default
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: dns
    - protocol: TCP
      port: dns-tcp
